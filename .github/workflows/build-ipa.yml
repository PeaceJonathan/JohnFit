name: Build IPA

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project JohnFit.xcodeproj \
            -scheme JohnFit \
            -destination 'platform=iOS Simulator,name=iPhone 15'

      - name: Build unsigned .app
        run: |
          xcodebuild \
            -project JohnFit.xcodeproj \
            -scheme JohnFit \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/JohnFit.app Payload/
          zip -r JohnFit.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: JohnFit-unsigned-ipa
          path: JohnFit.ipa
          retention-days: 14
