name: Build IPA

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          names = [
              d["name"]
              for devices in data["devices"].values()
              for d in devices
              if d.get("isAvailable", True) and d["name"].startswith("iPhone")
          ]
          print(names[0] if names else "")
          ')
          if [ -z "$NAME" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          echo "Using simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project JohnFit.xcodeproj \
            -scheme JohnFit \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}"

      - name: Build unsigned .app
        run: |
          xcodebuild \
            -project JohnFit.xcodeproj \
            -scheme JohnFit \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/JohnFit.app Payload/
          zip -r JohnFit.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: JohnFit-unsigned-ipa
          path: JohnFit.ipa
          retention-days: 14
